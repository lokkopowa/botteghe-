name: Crea APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['functions/**', 'firestore.rules', '*.md']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Controlla i segreti
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          for v in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Manca il segreto $v (vedi GUIDA.md, passo 5)"; exit 1; fi
          done

      - name: Installa e compila l'app web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Crea il progetto Android
        run: |
          npx cap add android
          node scripts/android-setup.mjs
          npx cap sync android

      - name: Inserisce google-services.json e la chiave di firma
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/allerta.keystore

      - name: Compila l'APK firmato
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rinomina
        run: cp android/app/build/outputs/apk/release/app-release.apk "AllertaBotteghe-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AllertaBotteghe-APK
          path: AllertaBotteghe-*.apk
          retention-days: 30
